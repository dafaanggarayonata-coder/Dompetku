<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e2e6ef;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #3b6cf8;
      --accent-light: #eef2ff;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }
    header span {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── LAYOUT ── */
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .wrapper { grid-template-columns: 1fr; }
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--accent); background: #fff; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; font-size: 12px; padding: 4px 10px; }
    .btn-danger:hover { background: #fee2e2; }

    /* ── SUMMARY STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-box .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-box .stat-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .stat-box.total .stat-value { color: var(--accent); }
    .stat-box.highest .stat-value { color: var(--danger); }
    .stat-box.count .stat-value { color: var(--success); }

    /* ── CHART ── */
    .chart-section { margin-bottom: 20px; }
    .chart-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .bar-chart { display: flex; flex-direction: column; gap: 8px; }
    .bar-row {
      display: grid;
      grid-template-columns: 90px 1fr 58px;
      align-items: center;
      gap: 8px;
    }
    .bar-row .bar-label { font-size: 12px; color: var(--text); font-weight: 500; text-align: right; }
    .bar-track {
      height: 22px;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      min-width: 4px;
    }
    .bar-row .bar-amount { font-size: 12px; font-weight: 700; color: var(--text); }

    /* ── DONUT CHART ── */
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .donut-wrap svg { flex-shrink: 0; }
    .donut-legend { flex: 1; min-width: 120px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-name { flex: 1; color: var(--text); }
    .legend-pct { color: var(--muted); font-size: 12px; font-weight: 600; }

    /* ── EXPENSE LIST ── */
    .expense-list { list-style: none; }
    .expense-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .expense-item:last-child { border-bottom: none; }
    .expense-cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .expense-info { flex: 1; min-width: 0; }
    .expense-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .expense-meta { font-size: 11px; color: var(--muted); }
    .expense-amount { font-weight: 700; font-size: 14px; color: var(--text); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state svg { opacity: 0.3; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--muted);
    }
    .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .filter-chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* ── MONTH INDICATOR ── */
    .month-badge {
      display: inline-block;
      padding: 2px 8px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    /* ── SCROLLABLE LIST ── */
    .list-scroll { max-height: 320px; overflow-y: auto; padding-right: 2px; }
    .list-scroll::-webkit-scrollbar { width: 4px; }
    .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .list-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── RIGHT COLUMN ── */
    .right-col { display: flex; flex-direction: column; gap: 20px; }
  </style>
</head>
<body>

<header>
  <h1>💳 Expense Analyzer</h1>
  <span id="date-display"></span>
</header>

<div class="wrapper">

  <!-- LEFT: ADD EXPENSE -->
  <div style="display:flex;flex-direction:column;gap:20px;">

    <div class="card">
      <div class="card-title">Add Expense</div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" id="inp-name" placeholder="e.g. Netflix subscription" />
      </div>
      <div class="form-group">
        <label>Amount (Rp)</label>
        <input type="number" id="inp-amount" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="inp-category">
          <option value="Food & Drink">🍔 Food & Drink</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Housing">🏠 Housing</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Entertainment">🎮 Entertainment</option>
          <option value="Health">💊 Health</option>
          <option value="Education">📚 Education</option>
          <option value="Utilities">💡 Utilities</option>
          <option value="Others">📦 Others</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="inp-date" />
      </div>

      <button class="btn btn-primary" onclick="addExpense()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add Expense
      </button>
    </div>

    <!-- SUMMARY STATS -->
    <div class="card">
      <div class="card-title">Summary</div>
      <div class="stats-grid">
        <div class="stat-box total">
          <div class="stat-label">Total Spent</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-box count">
          <div class="stat-label">Entries</div>
          <div class="stat-value" id="stat-count">0</div>
        </div>
        <div class="stat-box highest">
          <div class="stat-label">Largest</div>
          <div class="stat-value" id="stat-highest">0</div>
        </div>
      </div>

      <!-- Donut Chart -->
      <div class="chart-title">Spending by Category</div>
      <div class="donut-wrap">
        <svg id="donut-svg" width="110" height="110" viewBox="0 0 110 110"></svg>
        <div class="donut-legend" id="donut-legend">
          <div class="empty-state" style="padding:0;text-align:left;">
            <p>No data yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-col">

    <!-- BAR CHART: by Category -->
    <div class="card chart-section">
      <div class="card-title">Category Breakdown</div>
      <div class="bar-chart" id="bar-chart">
        <div class="empty-state">
          <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <p>Add expenses to see chart</p>
        </div>
      </div>
    </div>

    <!-- EXPENSE LIST -->
    <div class="card">
      <div class="card-title">
        Transactions
        <span class="month-badge" id="list-count-badge">0 items</span>
      </div>

      <div class="filter-bar" id="filter-bar">
        <div class="filter-chip active" onclick="setFilter('All', this)">All</div>
        <div class="filter-chip" onclick="setFilter('Food & Drink', this)">Food</div>
        <div class="filter-chip" onclick="setFilter('Transport', this)">Transport</div>
        <div class="filter-chip" onclick="setFilter('Shopping', this)">Shopping</div>
        <div class="filter-chip" onclick="setFilter('Entertainment', this)">Entertain</div>
        <div class="filter-chip" onclick="setFilter('Health', this)">Health</div>
        <div class="filter-chip" onclick="setFilter('Others', this)">Others</div>
      </div>

      <div class="list-scroll">
        <ul class="expense-list" id="expense-list">
          <li class="empty-state">
            <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <p>No transactions yet.<br>Add your first expense above.</p>
          </li>
        </ul>
      </div>
    </div>

  </div>
</div>

<script>
  // ── STATE ──────────────────────────────────────────────────────────────
  let expenses = JSON.parse(localStorage.getItem('ea_expenses') || '[]');
  let activeFilter = 'All';

  const CAT_COLORS = {
    'Food & Drink':   '#f97316',
    'Transport':      '#3b6cf8',
    'Housing':        '#8b5cf6',
    'Shopping':       '#ec4899',
    'Entertainment':  '#06b6d4',
    'Health':         '#22c55e',
    'Education':      '#eab308',
    'Utilities':      '#64748b',
    'Others':         '#a8a29e',
  };

  // ── INIT ───────────────────────────────────────────────────────────────
  document.getElementById('inp-date').valueAsDate = new Date();
  document.getElementById('date-display').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'long', day:'numeric' });
  render();

  // ── ADD ────────────────────────────────────────────────────────────────
  function addExpense() {
    const name   = document.getElementById('inp-name').value.trim();
    const amount = parseFloat(document.getElementById('inp-amount').value);
    const cat    = document.getElementById('inp-category').value;
    const date   = document.getElementById('inp-date').value;

    if (!name) return shake('inp-name');
    if (!amount || amount <= 0) return shake('inp-amount');

    expenses.unshift({ id: Date.now(), name, amount, cat, date });
    save();
    render();

    document.getElementById('inp-name').value   = '';
    document.getElementById('inp-amount').value = '';
    document.getElementById('inp-date').valueAsDate = new Date();
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#ef4444';
    el.style.animation = 'none';
    setTimeout(() => { el.style.borderColor = ''; }, 1200);
  }

  // ── DELETE ─────────────────────────────────────────────────────────────
  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    save();
    render();
  }

  // ── FILTER ─────────────────────────────────────────────────────────────
  function setFilter(cat, el) {
    activeFilter = cat;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderList();
  }

  // ── SAVE ───────────────────────────────────────────────────────────────
  function save() {
    localStorage.setItem('ea_expenses', JSON.stringify(expenses));
  }

  // ── RENDER ALL ─────────────────────────────────────────────────────────
  function render() {
    renderStats();
    renderBarChart();
    renderDonut();
    renderList();
  }

  // ── STATS ──────────────────────────────────────────────────────────────
  function renderStats() {
    const total   = expenses.reduce((s, e) => s + e.amount, 0);
    const highest = expenses.length ? Math.max(...expenses.map(e => e.amount)) : 0;
    document.getElementById('stat-total').textContent   = fmtShort(total);
    document.getElementById('stat-count').textContent   = expenses.length;
    document.getElementById('stat-highest').textContent = fmtShort(highest);
  }

  // ── BAR CHART ──────────────────────────────────────────────────────────
  function renderBarChart() {
    const container = document.getElementById('bar-chart');
    if (!expenses.length) {
      container.innerHTML = `<div class="empty-state"><svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><p>Add expenses to see chart</p></div>`;
      return;
    }

    const catTotals = {};
    expenses.forEach(e => { catTotals[e.cat] = (catTotals[e.cat] || 0) + e.amount; });
    const sorted = Object.entries(catTotals).sort((a,b) => b[1]-a[1]);
    const maxVal = sorted[0][1];

    container.innerHTML = sorted.map(([cat, val]) => {
      const pct = (val / maxVal * 100).toFixed(1);
      const color = CAT_COLORS[cat] || '#999';
      return `
        <div class="bar-row">
          <div class="bar-label">${cat}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="bar-amount">${fmtShort(val)}</div>
        </div>`;
    }).join('');
  }

  // ── DONUT CHART ────────────────────────────────────────────────────────
  function renderDonut() {
    const svg    = document.getElementById('donut-svg');
    const legend = document.getElementById('donut-legend');
    const total  = expenses.reduce((s, e) => s + e.amount, 0);

    if (!total) {
      svg.innerHTML = `<circle cx="55" cy="55" r="40" fill="none" stroke="#e2e6ef" stroke-width="20"/>`;
      legend.innerHTML = `<p style="color:#6b7280;font-size:13px;">No data yet</p>`;
      return;
    }

    const catTotals = {};
    expenses.forEach(e => { catTotals[e.cat] = (catTotals[e.cat] || 0) + e.amount; });
    const entries = Object.entries(catTotals).sort((a,b) => b[1]-a[1]);

    const cx = 55, cy = 55, R = 38, r = 22;
    const circumference = 2 * Math.PI * R;
    let offset = 0;
    let paths = '';

    entries.forEach(([cat, val]) => {
      const frac = val / total;
      const dashLen = frac * circumference;
      const color = CAT_COLORS[cat] || '#999';
      paths += `<circle
        cx="${cx}" cy="${cy}" r="${R}"
        fill="none"
        stroke="${color}"
        stroke-width="18"
        stroke-dasharray="${dashLen} ${circumference - dashLen}"
        stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${cx} ${cy})"
      />`;
      offset += dashLen;
    });

    svg.innerHTML = `
      ${paths}
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="white"/>
      <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d23">${entries.length}</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="9" fill="#6b7280">categories</text>
    `;

    legend.innerHTML = entries.slice(0, 6).map(([cat, val]) => {
      const pct = (val/total*100).toFixed(0);
      return `<div class="legend-item">
        <div class="legend-dot" style="background:${CAT_COLORS[cat]||'#999'}"></div>
        <span class="legend-name">${cat}</span>
        <span class="legend-pct">${pct}%</span>
      </div>`;
    }).join('');
  }

  // ── EXPENSE LIST ───────────────────────────────────────────────────────
  function renderList() {
    const list  = document.getElementById('expense-list');
    const badge = document.getElementById('list-count-badge');

    const filtered = activeFilter === 'All'
      ? expenses
      : expenses.filter(e => e.cat === activeFilter);

    badge.textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
      list.innerHTML = `<li class="empty-state">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p>No transactions ${activeFilter !== 'All' ? 'in this category' : 'yet'}.</p>
      </li>`;
      return;
    }

    list.innerHTML = filtered.map(e => {
      const color = CAT_COLORS[e.cat] || '#999';
      const d = e.date ? new Date(e.date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
      return `<li class="expense-item">
        <div class="expense-cat-dot" style="background:${color}"></div>
        <div class="expense-info">
          <div class="expense-name">${escHtml(e.name)}</div>
          <div class="expense-meta">${e.cat} · ${d}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="expense-amount">${fmt(e.amount)}</div>
          <button class="btn btn-danger" onclick="deleteExpense(${e.id})">✕</button>
        </div>
      </li>`;
    }).join('');
  }

  // ── UTILS ──────────────────────────────────────────────────────────────
  function fmt(n) {
    return 'Rp ' + n.toLocaleString('id-ID');
  }
  function fmtShort(n) {
    if (n >= 1_000_000) return 'Rp ' + (n/1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return 'Rp ' + (n/1_000).toFixed(0) + 'K';
    return 'Rp ' + n;
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── KEYBOARD SHORTCUT ──────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.closest('.card')) addExpense();
  });
</script>
</body>
</html>
